apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-v1
  labels:
    app: crm-v1
    version: v1
    roll: "24MIS0407"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-v1
  template:
    metadata:
      labels:
        app: crm-v1
        version: v1
    spec:
      containers:
      - name: crm-app
        image: niranjans1822/crm-app:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: crm-v1
  labels:
    app: crm-v1
    version: v1
spec:
  type: ClusterIP
  selector:
    app: crm-v1
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
